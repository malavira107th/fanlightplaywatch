<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In – FanLite Play</title>
  <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico" />
  <link rel="apple-touch-icon" href="assets/images/favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --black: #0a0a0a; --black2: #111111; --black3: #1a1a1a;
      --red: #E8192C; --blue: #1565C0;
      --white: #ffffff; --grey: #888888; --grey-light: #cccccc;
    }
    html { scroll-behavior: smooth; }
    body { background: var(--black); color: var(--white); font-family: 'Montserrat', sans-serif; overflow-x: hidden; }
    a { text-decoration: none; color: inherit; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--black2); }
    ::-webkit-scrollbar-thumb { background: var(--blue); border-radius: 3px; }

    /* HEADER */
    header { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: rgba(10,10,10,0.97); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(232,25,44,0.15); height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; }
    .nav-logo img { height: 46px; width: auto; object-fit: contain; }
    .nav-links { display: flex; align-items: center; gap: 32px; list-style: none; }
    .nav-links a { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--grey-light); transition: color 0.2s; position: relative; }
    .nav-links a::after { content: ''; position: absolute; bottom: -4px; left: 0; width: 0; height: 2px; background: var(--red); transition: width 0.3s; }
    .nav-links a:hover, .nav-links a.active { color: var(--red); }
    .nav-links a:hover::after, .nav-links a.active::after { width: 100%; }
    .nav-auth { display: flex; align-items: center; gap: 12px; }
    .btn-signin { padding: 8px 20px; border: 1.5px solid var(--red); border-radius: 4px; color: var(--red); font-size: 13px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; transition: all 0.2s; background: transparent; cursor: pointer; }
    .btn-signin:hover { background: var(--red); color: var(--black); }
    .btn-signup { padding: 8px 20px; background: linear-gradient(135deg, var(--red), var(--blue)); border: none; border-radius: 4px; color: var(--black); font-size: 13px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; cursor: pointer; transition: all 0.2s; }
    .btn-signup:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(232,25,44,0.3); }
    .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 4px; }
    .hamburger span { display: block; width: 24px; height: 2px; background: var(--red); border-radius: 2px; transition: all 0.3s; }
    .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
    .mobile-nav { display: none; position: fixed; top: 70px; left: 0; right: 0; background: rgba(10,10,10,0.98); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(232,25,44,0.2); padding: 20px 24px 28px; z-index: 999; flex-direction: column; }
    .mobile-nav.open { display: flex; }
    .mobile-nav a { display: block; padding: 14px 0; font-size: 14px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--grey-light); border-bottom: 1px solid rgba(255,255,255,0.06); transition: color 0.2s; }
    .mobile-nav a:hover { color: var(--red); }
    .mobile-nav .mobile-auth { display: flex; gap: 12px; margin-top: 20px; }
    .mobile-nav .btn-signin, .mobile-nav .btn-signup { flex: 1; text-align: center; }

    /* AUTH CONTAINER */
    .auth-wrapper { margin-top: 70px; min-height: calc(100vh - 70px); display: flex; align-items: center; justify-content: center; padding: 40px 20px; background: linear-gradient(135deg, var(--black) 0%, var(--black2) 100%); }
    .auth-card { background: var(--black2); border: 1px solid rgba(232,25,44,0.15); border-radius: 16px; padding: 48px 40px; max-width: 420px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.5); position: relative; }
    .auth-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent, var(--red), var(--blue), transparent); border-radius: 16px 16px 0 0; }

    /* LOGO */
    .auth-logo { display: flex; justify-content: center; margin-bottom: 32px; }
    .auth-logo img { height: 48px; width: auto; }

    /* FORM TITLE */
    .form-title { font-family: 'Oswald', sans-serif; font-size: 28px; font-weight: 700; color: var(--white); text-align: center; margin-bottom: 8px; }
    .form-title span { color: var(--red); }
    .form-subtitle { font-size: 13px; color: var(--grey); text-align: center; margin-bottom: 32px; }

    /* FORM GROUP */
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--blue); margin-bottom: 8px; }
    .form-group label .required { color: #ff6b6b; }
    .form-group input {
      width: 100%; background: var(--black3); border: 1px solid rgba(232,25,44,0.15);
      border-radius: 6px; padding: 12px 16px; color: var(--white);
      font-family: 'Montserrat', sans-serif; font-size: 14px;
      transition: border-color 0.2s; outline: none;
    }
    .form-group input:focus { border-color: var(--red); box-shadow: 0 0 0 3px rgba(232,25,44,0.1); }
    .form-group input::placeholder { color: var(--grey); }

    /* REMEMBER ME */
    .remember-forgot { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; font-size: 12px; }
    .remember-me { display: flex; align-items: center; gap: 6px; }
    .remember-me input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: var(--red); }
    .remember-me label { cursor: pointer; color: var(--grey-light); }
    .forgot-link { color: var(--red); transition: opacity 0.2s; }
    .forgot-link:hover { opacity: 0.8; }

    /* SUBMIT BUTTON */
    .form-submit { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--red), var(--blue)); border: none; border-radius: 6px; color: var(--black); font-family: 'Oswald', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; transition: all 0.3s; box-shadow: 0 4px 20px rgba(232,25,44,0.25); margin-top: 8px; }
    .form-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(232,25,44,0.4); }
    .form-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    /* DIVIDER */
    .form-divider { display: flex; align-items: center; gap: 12px; margin: 28px 0; }
    .form-divider::before, .form-divider::after { content: ''; flex: 1; height: 1px; background: rgba(232,25,44,0.1); }
    .form-divider span { font-size: 12px; color: var(--grey); text-transform: uppercase; }

    /* FOOTER LINK */
    .form-footer { text-align: center; font-size: 13px; color: var(--grey); }
    .form-footer a { color: var(--red); font-weight: 700; transition: opacity 0.2s; }
    .form-footer a:hover { opacity: 0.8; }

    /* MESSAGES */
    .form-message { display: none; padding: 14px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; margin-bottom: 20px; text-align: center; }
    .form-message.success { background: rgba(0,200,100,0.1); border: 1px solid rgba(0,200,100,0.3); color: #00c864; }
    .form-message.error { background: rgba(255,80,80,0.1); border: 1px solid rgba(255,80,80,0.3); color: #ff5050; }

    /* RESPONSIVE */
    @media (max-width: 768px) { .nav-links, .nav-auth { display: none; } .hamburger { display: flex; } .auth-card { padding: 32px 24px; } }
    @media (max-width: 480px) { footer { flex-direction: column; gap: 12px; padding: 12px 20px; font-size: 11px; } footer > div { width: 100%; text-align: center; } }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="nav-logo"><img src="assets/images/logo.png" alt="FanLite Play" /></div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="browse-contests.html">Browse</a></li>
      <li><a href="how-to-play.html">How to Play</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <div class="nav-auth" id="navAuth">
      <a href="login.html" class="btn-signin">Sign In</a>
      <a href="signup.html" class="btn-signup">Sign Up</a>
    </div>
    <div class="hamburger" id="hamburger" onclick="toggleMobileNav()">
      <span></span><span></span><span></span>
    </div>
  </header>
  <nav class="mobile-nav" id="mobileNav">
    <a href="index.html">Home</a>
    <a href="browse-contests.html">Browse</a>
    <a href="how-to-play.html">How to Play</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <div class="mobile-auth" id="mobileAuth">
      <a href="login.html" class="btn-signin">Sign In</a>
      <a href="signup.html" class="btn-signup">Sign Up</a>
    </div>
  </nav>

  <!-- AUTH WRAPPER -->
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-logo">
        <img src="assets/images/logo.png" alt="FanLite Play" />
      </div>

      <h1 class="form-title">Welcome <span>Back</span></h1>
      <p class="form-subtitle">Sign in to your account to continue</p>

      <div class="form-message" id="formMessage"></div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="username">Username or Email <span class="required">*</span></label>
          <input type="text" id="username" placeholder="cricketfan92 or you@example.com" required />
        </div>

        <div class="form-group">
          <label for="password">Password <span class="required">*</span></label>
          <input type="password" id="password" placeholder="••••••••" required />
        </div>

        <div class="remember-forgot">
          <div class="remember-me">
            <input type="checkbox" id="rememberMe" />
            <label for="rememberMe">Remember me</label>
          </div>
          <a href="forgot-password.html" class="forgot-link">Forgot Password?</a>
        </div>

        <button type="submit" class="form-submit" id="submitBtn">Sign In</button>
      </form>

      <div class="form-divider">
        <span>Don't have an account?</span>
      </div>

      <div class="form-footer">
        <a href="signup.html">Create Account</a>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer style="position: fixed; bottom: 0; left: 0; right: 0; background: rgba(10,10,10,0.95); border-top: 1px solid rgba(232,25,44,0.1); padding: 16px 40px; display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; font-size: 12px; color: var(--grey);">
    <div style="display: flex; align-items: center; gap: 16px;">
      <a href="index.html" style="color: var(--grey); transition: color 0.2s;">Home</a>
      <span style="color: rgba(255,255,255,0.1);">|</span>
      <a href="terms.html" style="color: var(--grey); transition: color 0.2s;">Terms</a>
      <span style="color: rgba(255,255,255,0.1);">|</span>
      <a href="privacy.html" style="color: var(--grey); transition: color 0.2s;">Privacy</a>
    </div>
    <span>&copy; 2026 FanLite Play. All rights reserved.</span>
  </footer>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('formMessage');

      // Get form values
      const usernameOrEmail = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      // Disable button and show loading
      btn.disabled = true;
      btn.textContent = 'Signing In...';

      // Simulate server delay
      setTimeout(() => {
        // Get users from localStorage
        const users = JSON.parse(localStorage.getItem('flp_users') || '[]');

        // Find user by username or email
        const user = users.find(u => (u.username === usernameOrEmail || u.email === usernameOrEmail) && u.password === btoa(password));

        if (!user) {
          msg.className = 'form-message error';
          msg.style.display = 'block';
          msg.textContent = '✗ Invalid username/email or password';
          btn.disabled = false;
          btn.textContent = 'Sign In';
          return;
        }

        // Save user session
        localStorage.setItem('flp_user', JSON.stringify({
          id: user.id,
          username: user.username,
          email: user.email,
          firstName: user.firstName
        }));

        // Show success message
        msg.className = 'form-message success';
        msg.style.display = 'block';
        msg.textContent = '✓ Login successful! Redirecting...';

        // Redirect after 2 seconds
        setTimeout(() => {
          window.location.href = 'browse-contests.html';
        }, 2000);
      }, 1500);
    }

    function toggleMobileNav() {
      document.getElementById('mobileNav').classList.toggle('open');
      document.getElementById('hamburger').classList.toggle('open');
    }

    // Check if already logged in
    if (localStorage.getItem('flp_user')) {
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
